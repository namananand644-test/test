
version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region us-east-1 |
        docker login --username AWS --password-stdin 538916376883.dkr.ecr.us-east-1.amazonaws.com

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t task-manager-api .

      - echo "Tagging image..."
      - docker tag task-manager-api:latest 538916376883.dkr.ecr.us-east-1.amazonaws.com/task-manager-api:latest

  post_build:
    commands:
      - echo "Pushing image to ECR..."
      - docker push 538916376883.dkr.ecr.us-east-1.amazonaws.com/task-manager-api:latest
